# Konum: .github/workflows/compile.yml
# oyuncu.pwn (gamemode) ve ultimate_admin.pwn (filterscript) dosyalarini her push'ta derler.
# Dosyalar repoda nerede olursa olsun (kok, gamemodes/, filterscripts/) bulunur.
name: Pawn Derle

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PAWNC_VERSION: "3.10.10"
  MYSQL_TAG: "R41-4"

jobs:
  compile:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oyuncu
            type: gamemodes
          - name: ultimate_admin
            type: filterscripts

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: 32-bit kutuphaneleri kur (pawncc 32-bit calisir)
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386

      - name: Pawn derleyicisini indir
        run: |
          mkdir -p .deps && cd .deps
          curl -fsSL -o pawnc.tar.gz \
            "https://github.com/pawn-lang/compiler/releases/download/v${PAWNC_VERSION}/pawnc-${PAWNC_VERSION}-linux.tar.gz"
          tar -xzf pawnc.tar.gz
          echo "PAWNCC_DIR=$PWD/pawnc-${PAWNC_VERSION}-linux" >> "$GITHUB_ENV"

      - name: Include dosyalarini indir (a_samp)
        run: |
          mkdir -p .deps/include && cd .deps
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git samp-stdlib
          cp samp-stdlib/*.inc include/

      - name: Ek include'lari indir (a_mysql, sscanf2, zcmd)
        if: matrix.name == 'oyuncu'
        run: |
          cd .deps
          git clone --depth 1 --branch "${MYSQL_TAG}" https://github.com/pBlueG/SA-MP-MySQL.git mysql \
            || git clone --depth 1 https://github.com/pBlueG/SA-MP-MySQL.git mysql
          git clone --depth 1 https://github.com/Y-Less/sscanf.git sscanf
          git clone --depth 1 https://github.com/Zeex/zcmd.git zcmd
          find mysql -name "a_mysql.inc" -exec cp {} include/ \; -quit
          find sscanf -name "sscanf2.inc" -exec cp {} include/ \; -quit
          find zcmd -name "zcmd.inc" -exec cp {} include/ \; -quit
          for f in a_mysql sscanf2 zcmd; do
            test -f include/$f.inc || { echo "::error::$f.inc bulunamadi"; exit 1; }
          done

      - name: ${{ matrix.name }}.pwn derle
        run: |
          SRC=$(find . -name "${{ matrix.name }}.pwn" -not -path "./.deps/*" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::${{ matrix.name }}.pwn repoda bulunamadi"
            exit 1
          fi
          mkdir -p build/${{ matrix.type }}
          export LD_LIBRARY_PATH="$PAWNCC_DIR/lib:$LD_LIBRARY_PATH"
          "$PAWNCC_DIR/bin/pawncc" "$SRC" \
            -i"$PAWNCC_DIR/include" -i.deps/include -i"$(dirname "$SRC")" \
            -o"build/${{ matrix.type }}/${{ matrix.name }}.amx" \
            -d3

      - name: Derlenen .amx dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-amx
          path: build/${{ matrix.type }}/${{ matrix.name }}.amx
          
