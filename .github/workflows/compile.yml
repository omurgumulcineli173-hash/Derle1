name: Compile AMX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pawn compiler
        run: |
          curl -L -o pawn.tar.gz https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar xf pawn.tar.gz

      - name: Download SA-MP includes
        run: git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git

      - name: Compile
        run: |
          export LD_LIBRARY_PATH="$PWD/pawnc-3.10.10-linux/lib"
          ./pawnc-3.10.10-linux/bin/pawncc ultimate_admin.pwn -i./samp-stdlib -o./ultimate_admin.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: ultimate_admin-amx
          path: ultimate_admin.amx
